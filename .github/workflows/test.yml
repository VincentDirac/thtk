name: Test

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          update: true
          install: base-devel mingw-w64-ucrt-x86_64-toolchain

      - env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: echo "$env:MSYS2_LOCATION"

      - name: Use the MSYS2 path
        run: |
          echo "Do something with $MSYS2_LOCATION"
