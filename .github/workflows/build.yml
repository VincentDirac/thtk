name: Build

on: [push, pull_request]

env:
  BUILD_TYPE: RelWithDebInfo
  FLEXBISON_VER: 2.5.25

jobs:
  build-win32-gcc-clang:
    runs-on: windows-2025
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install libjpeg
      shell: cmd
      run: |
        choco install -y libjpeg-turbo
    - name: Cache winflexbison
      id: cache-winflexbison
      uses: actions/cache@v4
      with:
        path: win_flex_bison-${{env.FLEXBISON_VER}}.zip
        key: winflexbison-${{env.FLEXBISON_VER}}
    - name: Download winflexbison
      if: steps.cache-winflexbison.outputs.cache-hit != 'true'
      run: curl -OL https://github.com/lexxmark/winflexbison/releases/download/v${{env.FLEXBISON_VER}}/win_flex_bison-${{env.FLEXBISON_VER}}.zip
    - name: Extract winflexbison
      run: |
        mkdir bison
        cd bison
        7z x ../win_flex_bison-${{env.FLEXBISON_VER}}.zip
    - name: Configure CMake
      env:
        CC: ${{matrix.compiler}}
        CXX: ${{matrix.compiler == 'gcc' && 'g++' || 'clang++'}}
      shell: cmd
      run: |
        cmake -B build -A ${{matrix.compiler}} -DBISON_EXECUTABLE=${{github.workspace}}/bison/win_bison.exe -DFLEX_EXECUTABLE=${{github.workspace}}/bison/win_flex.exe -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
    - name: Build
      shell: cmd
      run: |
        cmake --build build
    - name: Prepare Dist
      shell: cmd
      run: |
        call C:\shells\msys2bash.cmd -c "./make-release.sh ci"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: thtk-win32-${{matrix.compiler}}
        path: thtk-bin-ci/**/*
