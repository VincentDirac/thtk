name: Build

on: [push, pull_request]

env:
  BUILD_TYPE: RelWithDebInfo
  FLEXBISON_VER: 2.5.25

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Configure CMake
      env:
        CC: ${{matrix.compiler}}
        CXX: ${{matrix.compiler == 'gcc' && 'g++' || 'clang++'}}
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

  build-win32-msvc:
    runs-on: windows-2025
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Cache winflexbison
      id: cache-winflexbison
      uses: actions/cache@v4
      with:
        path: win_flex_bison-${{env.FLEXBISON_VER}}.zip
        key: winflexbison-${{env.FLEXBISON_VER}}
    - name: Download winflexbison
      if: steps.cache-winflexbison.outputs.cache-hit != 'true'
      run: curl -OL https://github.com/lexxmark/winflexbison/releases/download/v${{env.FLEXBISON_VER}}/win_flex_bison-${{env.FLEXBISON_VER}}.zip
    - name: Extract winflexbison
      run: |
        mkdir bison
        cd bison
        7z x ../win_flex_bison-${{env.FLEXBISON_VER}}.zip
    - name: Integrate vcpkg
      run: vcpkg integrate install
    - name: Install libjpeg
      run: vcpkg install libjpeg-turbo:${{matrix.arch}}-windows-static
    - name: Configure CMake
      run: |
        cmake -B build -A ${{matrix.arch == 'x86' && 'Win32' || matrix.arch}} -DBISON_EXECUTABLE=${{github.workspace}}/bison/win_bison.exe -DFLEX_EXECUTABLE=${{github.workspace}}/bison/win_flex.exe -DJPEG_INCLUDE_DIR=%VCPKG_INSTALLATION_ROOT%/packages/libjpeg-turbo_${{matrix.arch}}-windows-static/include -DJPEG_LIBRARY-RELEASE=%VCPKG_INSTALLATION_ROOT%/packages/libjpeg-turbo_${{matrix.arch}}-windows-static/lib/jpeg.lib -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}
    - name: Prepare Dist
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{matrix.arch}}
        set THTK_ARCH=${{matrix.arch}}
        call C:\shells\msys2bash.cmd -c "pacman -S --noconfirm --needed --noprogressbar groff dos2unix zip"
        call C:\shells\msys2bash.cmd -c "./make-release.sh ci"
        call C:\shells\msys2bash.cmd -c "cp '$(cygpath "$VCToolsRedistDir")/${THTK_ARCH:-x86}/Microsoft.VC143.OPENMP/vcomp140.dll' thtk-bin-ci/"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: thtk-win32-msvc-${{matrix.arch}}
        path: thtk-bin-ci/**/*
    - name: Upload Artifact PDBs
      uses: actions/upload-artifact@v4
      with:
        name: thtk-win32-msvc-${{matrix.arch}}-pdbs
        path: thtk-bin-ci-pdbs/**/*

  build-win32-msys2:
    runs-on: windows-2025
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install MSYS2 and required packages
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-llvm
          mingw-w64-ucrt-x86_64-clang
          mingw-w64-ucrt-x86_64-cmake
          git
          flex
          bison
          groff
          dos2unix
          zip
          mingw-w64-ucrt-x86_64-libjpeg-turbo
        msystem: UCRT64
    - name: Configure CMake
      env:
        CC: ${{matrix.compiler}}
        CXX: ${{matrix.compiler == 'gcc' && 'g++' || 'clang++'}}
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      shell: msys2 {0}
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DJPEG_INCLUDE_DIR=/d/a/_temp/msys64/ucrt64/include -DJPEG_LIBRARY_RELEASE=/d/a/_temp/msys64/ucrt64/lib/libjpeg.a
    - name: Build
      shell: msys2 {0}
      run: |
        cmake --build build --config ${{env.BUILD_TYPE}}
    - name: Prepare Dist
      shell: msys2 {0}
      run: |
        ./make-release.sh ci
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: thtk-win32-msys2-${{matrix.compiler}}
        path: thtk-bin-ci/**/*
