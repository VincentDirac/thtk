name: Build

on: [push, pull_request]

jobs:
  build-win32-gcc-clang:
    runs-on: windows-2025
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install libjpeg
      shell: cmd
      run: |
        choco install -y libjpeg-turbo
    - name: Configure CMake
      env:
        CC: ${{matrix.compiler}}
        CXX: ${{matrix.compiler == 'gcc' && 'g++' || 'clang++'}}
      shell: cmd
      run: |
        cmake -B build
    - name: Build
      shell: cmd
      run: |
        cmake --build build
    - name: Prepare Dist
      shell: cmd
      run: |
        call C:\shells\msys2bash.cmd -c "./make-release.sh ci"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: thtk-win32-${{matrix.compiler}}
        path: thtk-bin-ci/**/*
